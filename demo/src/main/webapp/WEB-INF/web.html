<!doctype html>
<html lang="es">

<head>
    <meta charset="UFT-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width" />
    <title>Toma de Asistencia DEMO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body class="paleta">
    <header>
        <a href="#" class="logo-header"></a>
        <nav class="navegacion">
            <a href="#">Home</a>
            <a href="#">Clases</a>
            <a href="#">Horario</a>
            <a href="#">Asistencia</a>
            <button class="btnLogin-popup">Ingresar</button>
        </nav>
    </header>

    <div class="wrapper">
        <span class="icon-close"><ion-icon name="close-circle-sharp"></ion-icon></span>

        <!-- El login -->>
        <div class="form-box login">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-sharp"></ion-icon></span>
                    <input type="email" required>
                    <label>Email</label>
                </div>
                
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-sharp"></ion-icon></span>
                    <input type="password" required>
                    <label>Contraseña</label>
                </div>

                <div class="recordar-olvidar">
                    <label><input type="checkbox">Recuerdame</label>
                    <a href="#">¿Has olvidado tu contraseña?</a>
                </div>
                <button type="submit" class="btn">Iniciar sesión</button>

                <div class="iniciar-registrar">
                    <p>¿No tienes una cuenta? <a href="#" class="registrar-link">Registrate</a></p>
                </div>

            </form>
        </div>

        <!-- Registrar -->>
        <div class="form-box registrar">
            <h2>Registrarse</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="person-sharp"></ion-icon></span>
                    <input type="text" required>
                    <label>Usuario</label>
                </div>

                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-sharp"></ion-icon></span>
                    <input type="email" required>
                    <label>Email</label>
                </div>
                
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-sharp"></ion-icon></span>
                    <input type="password" required>
                    <label>Contraseña</label>
                </div>

                <div class="recordar-olvidar">
                    <label><input type="checkbox" required>Acepto los Terminos y Condiciones</label>
                </div>
                <button type="submit" class="btn">Registrarse</button>

                <div class="iniciar-registrar">
                    <p>¿Ya tienes una cuenta? <a href="#" class="login-link">Inicia sesión</a></p>
                </div>

            </form>
        </div>

    </div>


    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
